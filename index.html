<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>گەڕانی کەسەکان</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-card">
    <img src="logo.svg" class="logo" alt="Logo">
    <h1> فۆڕمی خۆراک - سلێمانی</h1>
    <p id="loadStatus">ئامادە دەبێت...</p>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="loadDetail" class="load-detail"></div>
  </div>
</div>
<main id="app" class="app hidden">
  <header class="topbar">
    <div><div class="eyebrow"> DATABASE HACKED BY SAHAND KURDISH</div><h1>فۆڕمی خۆراک - سلێمانی </h1></div>
    <button id="resetDb" class="ghost" type="button" title="نوێکردنەوەی داتا">↻</button>
  </header>
  <section class="search-card">
    <div class="search-grid">
      <label>ناو<input id="name" autocomplete="off" enterkeyhint="search" placeholder="ناو..." autofocus></label>
      <label>ناوی باوک<input id="father" autocomplete="off" enterkeyhint="search" placeholder="ناوی باوک..." ></label>
      <label>ناوی باپیر<input id="grandfather" autocomplete="off" enterkeyhint="search" placeholder="ناوی باپیر..." ></label>
      <label>تەمەن / ساڵی لەدایکبوون<input id="age" inputmode="numeric" autocomplete="off" placeholder="30 یان 1996"></label>
    </div>
    <div id="searchState" class="search-state">بە نووسینی هەر پیتێک، گەڕان خۆکار دەکرێت.</div>
  </section>
  <section class="results-head"><div><h2>ئەنجامەکان</h2><span id="count">ئامادەی گەڕان</span></div></section>
  <section id="results" class="results"></section>
  <div id="pager" class="pager"></div>
</main>
<div id="modal" class="modal hidden" aria-hidden="true">
 <div id="modalBackdrop" class="modal-backdrop"></div>
 <section class="sheet"><button id="closeModal" class="close" type="button">×</button><div id="modalContent"></div></section>
</div>
<script src="app.js"></script>
</body>
</html>
